name: matchday

# Polls whatever Premier League match is in progress, scores the shots as they
# arrive, and publishes the result. Also records how stale ESPN's newest
# commentary line is -- the one claim in this project with no evidence yet.
#
# The schedule cannot know when matches are: cron times are fixed strings, and
# Premier League kickoffs land on ten different UTC times across a season
# because the UK leaves BST in October -- Saturday 3pm is 14:00 UTC in August
# and 15:00 UTC in November. Four hardcoded slots covered 119 of 361 fixtures.
#
# So it fires hourly through the hours football is played, and the script
# decides whether to stay awake: it keeps polling while a match is live or a
# kickoff is inside the next half hour, and otherwise exits after three quiet
# polls. A firing that catches nothing costs about three minutes.
#
# GitHub delays scheduled runs under load -- the first firing here was 52
# minutes late. That costs nothing but freshness: publish.py recomputes every
# total from the whole commentary on each poll rather than accumulating, and
# rebuilds the quarter-hour timeline the same way, so a job that joins at
# minute 40 still writes a complete and correct reading. Only the live updates
# during those 40 minutes are lost, and the hourly cadence means the next
# firing is never far behind.
#
# Live data goes to the `live-data` branch, not main: a matchday is thirty
# writes and main's history is for changes to the project, not for a feed.

on:
  schedule:
    # Every hour at :50, through the window every Premier League kickoff falls
    # in (11:30 to 20:00 UTC across the season). Kickoffs sit on :00 and :30,
    # so a firing at :50 either finds a match already running or one starting
    # within the half hour it waits for.
    - cron: "50 10-21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: how long to poll for
        default: "165"

concurrency:
  group: matchday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # requests is the only dependency. The model is committed as plain
      # numbers in models/xg.json and scored in pure Python, so no sklearn,
      # no pandas, and no pickle to trust.
      - run: pip install requests

      - name: watch the match
        run: |
          python src/publish.py --watch --every 60 \
            --minutes "${{ github.event.inputs.minutes || '165' }}" \
            --quit-after-idle 3

      # Once a match is over its reading is permanent, so it goes on main
      # rather than the live feed branch. Only new fixtures are fetched.
      - name: score whatever has finished
        if: always()
        run: python src/scorecard.py --since 2026-08-01

      - name: commit the season scorecard
        if: always()
        run: |
          git config user.name  "Dheepak Karan"
          git config user.email "elusanthi16@gmail.com"
          git stash push -- docs/live.json reports/latency.jsonl 2>/dev/null || true
          git pull --rebase --autostash origin main || true
          git add docs/scorecard.json
          git diff --cached --quiet || git commit -m "score finished matches"
          git push origin HEAD:main || true
          git stash pop 2>/dev/null || true

      - name: publish to the live-data branch
        if: always()
        run: |
          if [ ! -s docs/live.json ]; then echo "nothing to publish"; exit 0; fi
          git config user.name  "Dheepak Karan"
          git config user.email "elusanthi16@gmail.com"
          git fetch origin live-data --depth 1 2>/dev/null || true
          git checkout -B live-data
          git add -f docs/live.json reports/latency.jsonl
          git diff --cached --quiet || \
            git commit -m "live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin live-data
